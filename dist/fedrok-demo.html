  <style>/* Fedrok platform UI, following the Fedrok AG brand guidelines:
   Dark green #056032 for titles, headers and accents; the Sandy→Cinnabar
   gradient (45°) for accents; Eerie black #404042 for body copy; Cream
   #FBF1E5 only for backgrounds; Unbounded for titles, Work Sans for text;
   sharp 90° corners on frames and buttons; outline (stroke) icons. */
:root {
  --green: #056032;
  --green-deep: #044a27;
  --green-soft: #e3eee7;
  --sandy: #faa95b;
  --cinnabar: #f0492c;
  --ink: #404042;
  --ink-soft: #6b6b6e;
  --cream: #fbf1e5;
  --white: #ffffff;
  --line: rgba(64, 64, 66, 0.14);
  --grad: linear-gradient(45deg, var(--sandy), var(--cinnabar));
  --title: 'Unbounded', 'Work Sans', system-ui, sans-serif;
  --body: 'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --side: 248px;
}
* { box-sizing: border-box; border-radius: 0 !important; }
html, body { margin: 0; }
body { background: var(--cream); color: var(--ink); font-family: var(--body); font-weight: 400; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--green); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
h1, h2, h3, h4 { font-family: var(--title); color: var(--green); font-weight: 500; margin: 0; letter-spacing: 0.01em; }
h1 { font-size: 26px; text-transform: uppercase; line-height: 1.2; }
h2 { font-size: 16px; text-transform: uppercase; }
h3 { font-size: 14px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--ink-soft); }
.small { font-size: 13px; }

/* ---------- shell */
.shell { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
.side { background: var(--green); color: var(--white); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.side::after { content: ''; position: absolute; width: 360px; height: 360px; border: 34px solid rgba(255, 255, 255, 0.05); border-radius: 50% !important; right: -200px; bottom: -150px; pointer-events: none; }
.brand { padding: 26px 22px 22px; display: block; }
.brand img { height: 38px; display: block; }
.brand small { display: block; font-family: var(--title); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255, 255, 255, 0.7); margin-top: 10px; }
.nav { display: flex; flex-direction: column; padding: 8px 12px; gap: 2px; flex: 1; overflow-y: auto; }
.nav a { display: flex; align-items: center; gap: 12px; color: rgba(255, 255, 255, 0.86); padding: 10px 12px; font-weight: 500; font-size: 14px; border-left: 3px solid transparent; }
.nav a:hover { background: rgba(255, 255, 255, 0.07); text-decoration: none; }
.nav a.active { background: rgba(255, 255, 255, 0.1); border-image: var(--grad) 1; color: var(--white); }
.nav svg { width: 20px; height: 20px; flex: none; }
.side-foot { padding: 16px 22px 22px; font-size: 12px; color: rgba(255, 255, 255, 0.72); border-top: 1px solid rgba(255, 255, 255, 0.12); position: relative; z-index: 1; }
.side-foot .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50% !important; background: var(--sandy); margin-right: 6px; }
.side-foot .dot.live { background: #7fe0a6; box-shadow: 0 0 0 3px rgba(127, 224, 166, 0.25); }
.topbar { display: none; }
main { min-width: 0; }
.page { padding: 34px 40px 60px; max-width: 1320px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; flex-wrap: wrap; }
.eyebrow { font-family: var(--title); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cinnabar); margin-bottom: 8px; }
.lede { max-width: 720px; margin: 10px 0 0; font-weight: 300; font-size: 16px; }

/* ---------- hero */
.hero { position: relative; background: var(--green); color: var(--white); padding: 36px 40px; overflow: hidden; margin-bottom: 26px; }
.hero h1 { color: var(--white); font-size: 30px; max-width: 640px; }
.hero p { max-width: 560px; font-weight: 300; font-size: 16px; color: rgba(255, 255, 255, 0.88); margin: 12px 0 0; }
.hero .ring { position: absolute; right: -60px; top: -80px; width: 340px; height: 340px; border-radius: 50% !important; background: var(--grad); -webkit-mask: radial-gradient(circle, transparent 58%, #000 58.5%); mask: radial-gradient(circle, transparent 58%, #000 58.5%); opacity: 0.95; }
.hero .disc { position: absolute; right: 170px; bottom: -120px; width: 220px; height: 220px; border-radius: 50% !important; background: rgba(255, 255, 255, 0.06); }
.hero .mode { position: relative; display: inline-flex; gap: 10px; align-items: center; margin-top: 20px; background: rgba(255, 255, 255, 0.1); padding: 8px 14px; font-size: 13px; }

/* ---------- cards & grids */
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card { background: var(--white); border: 1px solid var(--line); padding: 22px; min-width: 0; }
.card > h2 { margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card > h2 .aside { font-family: var(--body); text-transform: none; font-size: 13px; font-weight: 400; color: var(--ink-soft); }
.kpi { background: var(--white); border: 1px solid var(--line); padding: 18px 20px 16px; position: relative; }
.kpi::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--grad); }
.kpi.green::before { background: var(--green); }
.kpi .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); font-weight: 500; }
.kpi .value { font-family: var(--title); font-size: 24px; color: var(--green); margin-top: 6px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .value small { font-size: 13px; color: var(--ink-soft); font-family: var(--body); margin-left: 4px; }
.kpi .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
.section { margin-top: 26px; }

/* ---------- tables */
.table-wrap { overflow-x: auto; margin: 0 -22px -22px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); padding: 10px 22px; border-bottom: 1px solid var(--line); white-space: nowrap; background: #fdfaf6; }
td { padding: 11px 22px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:hover { background: #fdfaf6; }
.empty { padding: 26px 0 4px; color: var(--ink-soft); text-align: center; }

/* ---------- pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; padding: 3px 9px; border: 1px solid var(--line); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.05em; }
.pill.green { background: var(--green-soft); color: var(--green); border-color: transparent; }
.pill.grad { background: var(--grad); color: var(--white); border-color: transparent; }
.pill.warn { background: #fde6df; color: #a32c17; border-color: transparent; }
.pill.grey { background: #f1f0ee; color: var(--ink-soft); border-color: transparent; }
.pill .d { width: 7px; height: 7px; border-radius: 50% !important; background: currentColor; }

/* ---------- forms & buttons */
.btn { font-family: var(--body); font-weight: 500; font-size: 14px; border: 1px solid var(--green); background: var(--green); color: var(--white); padding: 10px 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; line-height: 1.2; }
.btn:hover { background: var(--green-deep); text-decoration: none; }
.btn.ghost { background: transparent; color: var(--green); }
.btn.ghost:hover { background: var(--green-soft); }
.btn.accent { background: var(--grad); border-color: transparent; }
.btn.accent:hover { filter: brightness(0.96); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
form.stack { display: grid; gap: 14px; }
.row { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink); }
label .hint { font-weight: 400; color: var(--ink-soft); font-size: 12px; }
input, select, textarea { font: inherit; font-weight: 400; color: var(--ink); border: 1px solid rgba(64, 64, 66, 0.28); background: var(--white); padding: 10px 12px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--sandy); outline-offset: -1px; border-color: transparent; }
textarea { min-height: 80px; resize: vertical; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { display: flex; gap: 0; min-width: min(460px, 100%); }
.search input { border-right: 0; }

/* ---------- misc */
.kv { display: grid; grid-template-columns: 180px minmax(0, 1fr); border-top: 1px solid var(--line); }
.kv > div { padding: 10px 0; border-bottom: 1px solid var(--line); word-break: break-word; }
.kv > div:nth-child(odd) { color: var(--ink-soft); font-size: 13px; padding-right: 14px; }
.addr { font-family: var(--mono); font-size: 12.5px; }
.feed { display: grid; gap: 0; }
.feed-item { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: center; }
.feed-item:last-child { border-bottom: 0; }
.blockbadge { font-family: var(--title); font-size: 12px; color: var(--green); border: 1px solid var(--green); padding: 6px 0; text-align: center; }
.blockbadge.g { border-image: var(--grad) 1; color: var(--cinnabar); }
.rr { display: flex; gap: 8px; flex-wrap: wrap; }
.rr .slot { border: 1px solid var(--line); padding: 8px 12px; font-size: 12.5px; min-width: 132px; }
.rr .slot.now { border-color: var(--green); background: var(--green-soft); }
.rr .slot b { display: block; font-family: var(--title); font-weight: 500; font-size: 11px; color: var(--green); text-transform: uppercase; }
.note { border-left: 3px solid; border-image: var(--grad) 1; background: var(--white); padding: 14px 18px; font-size: 14px; }
.note.plain { border-image: none; border-color: var(--green); }
.toast-host { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 10px; z-index: 50; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--white); padding: 12px 16px; font-size: 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18); border-left: 4px solid var(--sandy); }
.toast.ok { border-left-color: #7fe0a6; }
.toast.err { border-left-color: var(--cinnabar); }
.toast a { color: var(--sandy); }
.icon-outline { width: 40px; height: 40px; color: var(--green); }
.feature { display: grid; grid-template-columns: 44px 1fr; gap: 14px; }
.feature p { margin: 4px 0 0; font-size: 14px; }
.circle-stat { width: 128px; height: 128px; border-radius: 50% !important; border: 10px solid var(--green); display: grid; place-items: center; text-align: center; flex: none; }
.bar { height: 8px; background: #efe8de; position: relative; overflow: hidden; }
.bar > span { position: absolute; inset: 0 auto 0 0; background: var(--grad); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 16px; font: inherit; font-weight: 500; color: var(--ink-soft); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button.active { color: var(--green); border-image: var(--grad) 1; }
pre.code { background: #1f2a24; color: #e8efe9; padding: 16px; overflow-x: auto; font-size: 12.5px; margin: 0; }

/* ---------- certificate */
.cert { background: var(--white); border: 1px solid var(--line); padding: 48px 56px; position: relative; overflow: hidden; max-width: 900px; }
.cert::before { content: ''; position: absolute; width: 420px; height: 420px; right: -170px; top: -170px; border-radius: 50% !important; background: var(--cream); }
.cert::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--grad); }
.cert > * { position: relative; }
.cert .logo { height: 46px; }
.cert h1 { font-size: 30px; margin-top: 30px; }
.cert .big { font-family: var(--title); font-size: 46px; color: var(--green); margin: 18px 0 4px; }
.cert .grid { margin-top: 26px; }

/* Personal Legacy Garden */
.gmap { width: 100%; height: auto; display: block; font-family: var(--body); }
.gmap a circle { cursor: pointer; }
.gmap a:hover circle:last-child { stroke: var(--ink); stroke-width: 0.6; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50% !important; margin-right: 6px; vertical-align: -1px; }
.legend i.ring { background: transparent; border: 2px solid var(--cinnabar); }
.bar.target { height: 14px; overflow: visible; }
.bar.target > b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--green); }
.bar.mini { height: 4px; margin-top: 4px; }
.tree-illus { width: 100%; max-width: 240px; height: auto; }
.chart { width: 100%; height: auto; }
.qr-card { text-align: center; }
.qr-card svg { display: block; margin: 8px auto; max-width: 100%; height: auto; }
.ded-card .kv { margin-top: 4px; }
label.check { display: flex; gap: 8px; align-items: baseline; font-weight: 400; }
label.check input { width: auto; }
.nowrap { white-space: nowrap; }

@media print {
  .side, .topbar, .no-print, .toast-host { display: none !important; }
  .shell { display: block; }
  body { background: #fff; }
  .page { padding: 0; }
}

/* ---------- responsive */
@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 264px; transform: translateX(-100%); transition: transform 0.2s; z-index: 40; }
  body.nav-open .side { transform: none; }
  .topbar { display: flex; align-items: center; justify-content: space-between; background: var(--green); padding: 12px 16px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; }
  .topbar img { height: 28px; }
  .topbar button { background: none; border: 1px solid rgba(255, 255, 255, 0.4); color: #fff; padding: 6px 10px; }
  .page { padding: 22px 16px 48px; }
  .hero { padding: 26px 20px; }
  .hero h1 { font-size: 22px; }
  .hero .ring { width: 200px; height: 200px; right: -70px; top: -60px; }
  .g2, .g3, .g4, .row { grid-template-columns: minmax(0, 1fr); }
  .kv { grid-template-columns: minmax(0, 1fr); }
  .kv > div:nth-child(odd) { padding-bottom: 0; border-bottom: 0; }
  .cert { padding: 28px 22px; }
  .cert .big { font-size: 32px; }
  .table-wrap { margin: 0 -22px -22px; }
}
.hero .mode svg { width: 18px; height: 18px; flex: none; }
.hero .mode a { color: #fff; }
.hero > :not(.ring):not(.disc) { position: relative; z-index: 1; }
@media (max-width: 860px) { .hero .ring { opacity: 0.35; } }
.row { align-items: end; }
